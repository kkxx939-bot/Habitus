name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      M2BOS_PYTHON_PATHS: Config Runtime ModelClient pre memory behavior infrastructure foundation integrations benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[model,http,observability,test]'
          python -m pip install build ruff mypy pyright
      - name: Verify Agent plugins
        working-directory: plugins
        run: |
          npm run sync
          git diff --exit-code -- m2bos-memory/scripts/shared m2bos-memory-claude-code/scripts/shared
          npm test
      - name: Compile
        run: python -m compileall -q $M2BOS_PYTHON_PATHS
      - name: Lint
        run: ruff check $M2BOS_PYTHON_PATHS
      - name: Type check
        run: |
          mypy $M2BOS_PYTHON_PATHS
          pyright $M2BOS_PYTHON_PATHS
      - name: Full deterministic test suite with branch coverage
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report
      - name: Verify unified bootstrap and secure non-interactive init
        run: |
          init_root="$RUNNER_TEMP/m2bos-init"
          m2bos --help
          m2bos-server init --help
          m2bos init --config "$init_root/config.yaml" --from-config Config/example.yaml --non-interactive --skip-doctor --no-start
          test -f "$init_root/config.yaml"
          test "$(stat -c '%a' "$init_root/config.yaml")" = "600"
          M2BOS_CI_CONFIG_PATH="$init_root/config.yaml" python -c 'import os; from Config import M2BOSConfig; c=M2BOSConfig.from_file(os.environ["M2BOS_CI_CONFIG_PATH"]); assert c.models.chat.route.credential_ref == "deepseek"; assert c.models.embedding.route.credential_ref == "ark"; assert c.models.rerank.route.credential_ref == "dashscope"; assert c.memory.vector_store.route.credential_ref == "vikingdb"'
          m2bos harnesses
      - name: Build wheel with service and plugin assets
        run: |
          python -m build --wheel
          python -c 'import zipfile,glob; p=glob.glob("dist/*.whl")[0]; names=zipfile.ZipFile(p).namelist(); assert any(n.endswith("share/m2bos/plugins/install-memory-plugin.mjs") for n in names); assert any(n.endswith("share/m2bos/plugins/harnesses.mjs") for n in names)'
      - name: Install wheel and execute packaged plugin lifecycle
        run: |
          smoke_venv="$RUNNER_TEMP/m2bos-wheel-smoke"
          marketplace_root="$RUNNER_TEMP/m2bos-marketplace"
          doctor_output="$RUNNER_TEMP/m2bos-plugin-doctor.json"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/pip" install --no-deps dist/*.whl
          "$smoke_venv/bin/m2bos" --help
          "$smoke_venv/bin/m2bos-server" init --help
          "$smoke_venv/bin/m2bos-plugin" harnesses --json
          "$smoke_venv/bin/m2bos-plugin" install --prepare-only --root "$marketplace_root" --json
          "$smoke_venv/bin/m2bos-plugin" update --prepare-only --root "$marketplace_root" --json
          "$smoke_venv/bin/m2bos-plugin" status --root "$marketplace_root" --json
          set +e
          M2BOS_URL=http://127.0.0.1:1 M2BOS_PLUGIN_TIMEOUT_MS=250 "$smoke_venv/bin/m2bos-plugin" doctor > "$doctor_output"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          python -c 'import json,sys; payload=json.load(open(sys.argv[1])); checks={item["name"]:item for item in payload["checks"]}; assert checks["bundle"]["status"] == "pass"; assert checks["manifests"]["status"] == "pass"; assert checks["shared_bundle"]["status"] == "pass"' "$doctor_output"
