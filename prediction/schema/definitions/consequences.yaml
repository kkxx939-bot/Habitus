prediction_type: consequence
description: 一个不可变的行为发生前上下文、已选行为与单条真实 Outcome 样本。
path_template: samples/consequences/{sample_date:%Y}/{sample_date:%m}/{sample_date:%d}/{shard}/{materialization_id}.md
operation_mode: add_only
fields:
  - {name: sample_date, type: date, role: address, required: true, description: 被评估行为发生前锚点的本地日期。}
  - {name: logical_sample_id, type: sample_id, role: address, required: true, description: 同一行为选择与 Outcome 问题跨投影版本保持稳定的 SHA-256 身份。}
  - {name: materialization_id, type: sample_id, role: address, required: true, description: 逻辑样本与投影合同版本共同派生的物化身份。}
  - {name: prediction_scope, type: scope, role: content, required: true, description: 本样本预测的主体、层级、领域和模式。}
  - {name: anchor, type: anchor, role: content, required: true, description: 目标 Event 或 Action 发生前的严格切点。}
  - {name: input, type: input, role: content, required: true, description: 目标行为前已知的观测、行为前缀与决策空间。}
  - {name: treatment, type: treatment, role: content, required: true, description: 模型可见的被评估 Event 或 Action；后果预测必须明确给定行为。}
  - {name: label, type: consequence_label, role: content, required: true, description: 给定 treatment 后真实观察到的 Outcome 和归因强度。}
  - {name: supervision, type: supervision, role: content, required: true, description: 标签观测窗口与客观截断状态；训练准入由具体数据集构建器计算。}
  - {name: lineage, type: lineage, role: content, required: true, description: 目标 Event、Action 与 Outcome 的系谱和结果分组。}
  - {name: identity_material, type: identity_material, role: system, required: true, description: 可重新计算逻辑身份的规范 Outcome 与目标行为材料。}
  - {name: materialization_context, type: identity_material, role: system, required: true, description: 保存 Outcome 容器 revision，使历史物化版本可审计且不覆盖。}
  - {name: provenance, type: provenance, role: system, required: true, description: 来源版本摘要与确定性投影器身份。}
  - {name: quality, type: quality, role: content, required: true, description: 样本证据和上下文完整性质量。}
