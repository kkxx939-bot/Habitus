memory_type: profile
description: >-
  回答“用户是谁”，只保存相对稳定的客观自我事实，例如职业、背景、长期角色、稳定能力和
  稳定客观状态。不保存沟通方式、输出格式、工作流程、工具选择、喜欢或不喜欢；这些“用户如何选择”
  的内容统一进入 preferences。也不保存短期情绪、一次性事件、计划或模型推测。
path_template: profile.md
operation_mode: upsert
markdown_template: |
  # Profile

  {content}
fields:
  - name: content
    type: string
    role: content
    required: true
    merge: patch
    description: >-
      使用简洁、自包含的 Markdown bullet 保存用户明确陈述或确认的职业、背景、长期角色、
      稳定能力和客观状态；合并重复事实，发生冲突时保留较新的明确陈述。不记录沟通风格、
      输出偏好、工作习惯、选择倾向、推测或敏感信息。
