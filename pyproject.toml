[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryos"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
model = [
    "json-repair>=0.25.0,<1",
    "jsonschema>=4,<5",
]
vikingdb = ["volcengine>=1.0.216"]
test = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["Config*", "Runtime*", "ModelClient*", "pre*", "memory*", "infrastructure*", "foundation*", "integrations*"]

[tool.setuptools.package-data]
"Config" = ["*.yaml"]
"memory.schema.definitions" = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["Config", "Runtime", "ModelClient", "pre", "memory", "infrastructure", "foundation"]
reportUnsupportedDunderAll = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["Config", "Runtime", "ModelClient", "pre", "memory", "infrastructure", "foundation"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
