[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "habitus"
version = "0.1.0"
requires-python = ">=3.12"
# PEP 639 的 SPDX 写法，需要 setuptools>=77（见 build-system.requires）。
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "gulf" }]
# tzdata：Windows 没有系统 IANA 时区库，zoneinfo 要靠它（habitus/config/locale.py 构造时就调 ZoneInfo）。
# truststore：调模型服务时默认读操作系统证书库（公司代理做 TLS 解密时根证书在那里），见配置 network.trust_store。
# certifi：network.trust_store: bundled 直接用它（habitus/foundation/network.py），不靠 httpx 间接带进来。
# tzlocal：habitus-server init 检测系统时区（macOS / Linux 读 /etc/localtime 与 TZ，Windows 把注册表时区名换成 IANA 名），W3。
# numpy：默认的本地向量库（infrastructure/vector/adapters/local_sqlite.py）用它暴力算余弦，W8。
dependencies = [
    "PyYAML>=6.0.2,<7",
    "httpx>=0.28,<1",
    "tzdata>=2025.2",
    "truststore>=0.10.5,<1",
    "certifi>=2024.7.4",
    "tzlocal>=5.2,<6",
    "numpy>=2.0,<3",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
model = [
    "json-repair>=0.58.5,<1",
    "jsonschema>=4,<5",
]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "json-repair>=0.58.5,<1",
    "jsonschema>=4,<5",
]
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]
test = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
]
# 静态检查与打包工具。这里只声明范围；CI 与本地实际装的精确版本在 requirements.txt 里
# （由 uv pip compile 从本文件生成，见 requirements.txt 头部的命令）。
dev = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "pyright>=1.1.411,<1.2",
    "build>=1.5,<2",
]

[project.scripts]
habitus-server = "habitus.integrations.local_service.console:main"

[tool.setuptools.packages.find]
where = ["."]
# 记忆基准（habitus/benchmark）是开发工具，只在仓库里跑（python -m habitus.benchmark），不随服务发布。
exclude = ["habitus.benchmark", "habitus.benchmark.*"]
include = ["habitus*"]

[tool.setuptools.package-data]
"habitus.config" = ["*.yaml"]
"habitus.memory.schema.definitions" = ["*.yaml"]
"habitus.behavior.schema.definitions" = ["*.yaml"]
"habitus.conditions" = ["holidays/*/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # 以最低支持版本（requires-python，现为 3.12）为目标时 UP 报的写法，逐条评估过：
    # UP017（timezone.utc→UTC）与 UP041（asyncio.TimeoutError→TimeoutError）是安全的机械
    # 替换，已经改完，不再豁免。
    # 下面四条属于 PEP 695 的新泛型/类型别名语法与 StrEnum，改法会动到运行时语义
    # （StrEnum 的 str() 行为、泛型的方差推断），收益只是写法更新，暂不跟进。
    "UP040",  # 类型别名改用 type 语句
    "UP042",  # (str, Enum) 改用 StrEnum
    "UP046",  # 泛型类改用 PEP 695 形参
    "UP047",  # 泛型函数改用 PEP 695 形参
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["habitus"]
# 关着是因为 integrations 的两个包用 ``__getattr__`` 懒加载（HTTP 适配器不该把 FastAPI 拖进
# 轻量 Doctor），静态检查看不穿它、会把合法的导出全报成缺失。真正守 ``__all__`` 的是
# tests/architecture 里那条契约测试——它按运行时的 ``hasattr`` 判，懒加载照样过得去。
reportUnsupportedDunderAll = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "multiprocess: 起真实 OS 进程的换代多进程测试（约 20 秒；CI 的 pytest 照常跑到）",
]

[tool.coverage.run]
branch = true
source = ["habitus"]
omit = ["tests/*", "habitus/benchmark/*"]

[tool.coverage.report]
precision = 2
fail_under = 79
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # 只排除整行是 ``...`` 的桩；裸的 '\.\.\.' 会连签名里含 tuple[X, ...] 的整个函数体一起排除（评审实测全仓库约 15% 语句被静默排除）
    '^\s*\.\.\.\s*$',
]
