[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "habitus"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
http = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
model = [
    "json-repair>=0.58.5,<1",
    "jsonschema>=4,<5",
]
vikingdb = ["volcengine>=1.0.216"]
cloud = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "json-repair>=0.58.5,<1",
    "jsonschema>=4,<5",
    "volcengine>=1.0.216",
]
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]
test = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
]

[project.scripts]
habitus-benchmark = "benchmark.cli:main"
habitus = "integrations.local_service.cli:main"
habitus-server = "integrations.local_service.cli:main"
habitus-http = "integrations.local_service.cli:main"
habitus-plugin = "integrations.local_service.plugin_cli:main"

[tool.setuptools.data-files]
"share/habitus/plugins" = ["plugins/harnesses.mjs", "plugins/install-memory-plugin.mjs", "plugins/package.json"]
"share/habitus/plugins/memory-plugin-shared" = ["plugins/memory-plugin-shared/doctor.mjs"]
"share/habitus/plugins/memory-plugin-shared/lib" = ["plugins/memory-plugin-shared/lib/*.mjs"]
"share/habitus/plugins/habitus-memory" = ["plugins/habitus-memory/LICENSE"]
"share/habitus/plugins/habitus-memory/.codex-plugin" = ["plugins/habitus-memory/.codex-plugin/plugin.json"]
"share/habitus/plugins/habitus-memory/hooks" = ["plugins/habitus-memory/hooks/hooks.json"]
"share/habitus/plugins/habitus-memory/scripts" = ["plugins/habitus-memory/scripts/*.mjs"]
"share/habitus/plugins/habitus-memory/scripts/shared" = ["plugins/habitus-memory/scripts/shared/*.mjs"]
"share/habitus/plugins/habitus-memory-claude-code" = ["plugins/habitus-memory-claude-code/LICENSE"]
"share/habitus/plugins/habitus-memory-claude-code/.claude-plugin" = ["plugins/habitus-memory-claude-code/.claude-plugin/plugin.json"]
"share/habitus/plugins/habitus-memory-claude-code/hooks" = ["plugins/habitus-memory-claude-code/hooks/hooks.json"]
"share/habitus/plugins/habitus-memory-claude-code/scripts" = ["plugins/habitus-memory-claude-code/scripts/*.mjs"]
"share/habitus/plugins/habitus-memory-claude-code/scripts/shared" = ["plugins/habitus-memory-claude-code/scripts/shared/*.mjs"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "Config*",
    "Runtime*",
    "ModelClient*",
    "pre*",
    "conversation*",
    "memory*",
    "behavior*",
    "prediction*",
    "infrastructure*",
    "foundation*",
    "integrations*",
    "benchmark*",
]

[tool.setuptools.package-data]
"Config" = ["*.yaml"]
"benchmark" = ["README.md", "datasets/*.json", "policies/*.json"]
"memory.schema.definitions" = ["*.yaml"]
"behavior.schema.definitions" = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["Config", "Runtime", "ModelClient", "pre", "conversation", "memory", "behavior", "prediction", "infrastructure", "foundation", "integrations", "benchmark"]
reportUnsupportedDunderAll = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["Config", "Runtime", "ModelClient", "pre", "conversation", "memory", "behavior", "prediction", "infrastructure", "foundation", "integrations"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 2
fail_under = 79
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
