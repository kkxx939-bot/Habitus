# m2bOS 启动时只读取一次该结构；用户副本可在 credentials 中保存真实密钥。
storage:
  root: ~/.m2bos
  sqlite_lock:
    timeout_seconds: 5.0

# 真实凭据只写入 ~/.m2bos/config.yaml；该文件及备份必须保持 0600。
# 空值可用于生成模板，但 Doctor 和 Runtime 会拒绝被引用的空秘密。
credentials:
  deepseek:
    api_key: ""
  ark:
    api_key: ""
  dashscope:
    api_key: ""
  vikingdb:
    access_key: ""
    secret_key: ""

http:
  host: 127.0.0.1
  port: 8787
  max_request_bytes: 16777216

observability:
  metrics:
    enabled: true
    namespace: m2bos
    max_recent_events: 512
    duration_buckets_seconds: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0]
  logging:
    enabled: true
    level: INFO
  tracing:
    enabled: false
    endpoint: http://127.0.0.1:4318
    protocol: http
    service_name: m2bos
    insecure: true
    credential_ref: ""
    export_interval_seconds: 10.0
  audit:
    enabled: true
    retention_days: 14
    max_records: 10000
  lock_warning_seconds: 300.0

models:
  chat:
    route:
      provider: deepseek
      adapter: openai_compatible_chat
      model: deepseek-chat
      base_url: https://api.deepseek.com
      credential_ref: deepseek
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body: {}
    context_window_tokens: 64000
    max_output_tokens: null
    structured_output_mode: json_object
    reasoning: false

  embedding:
    route:
      provider: volcengine
      adapter: ark_multimodal
      model: doubao-embedding-vision-251215
      base_url: https://ark.cn-beijing.volces.com/api/v3
      credential_ref: ark
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body: {}
    dimension: 1024
    input_mode: multimodal
    max_batch_size: 32
    max_input_chars: 16000
    query_parameters: {}
    document_parameters: {}

  rerank:
    route:
      provider: aliyun
      adapter: openai_compatible_rerank
      model: qwen3-rerank
      # 替换为创建 API Key 时显示的 API Host；华北 2（北京）需填真实 WorkspaceId。
      base_url: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-api/v1
      credential_ref: dashscope
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 8
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body:
        instruct: Given a web search query, retrieve relevant passages that answer the query.
    max_documents: 100
    max_query_chars: 8000
    max_document_chars: 16000

  structured_output:
    allow_json_repair: true
    validation_retries: 1

conversation:
  journal:
    max_file_bytes: 67108864
    max_history_files: 10000
    max_conversation_tree_entries: 100000
    max_ingress_receipts: 100000
    max_ingress_receipt_bytes: 16384
    lock_ttl_seconds: 30
    lock_wait_timeout_seconds: 5.0
    lock_retry_delay_seconds: 0.01

  segmentation:
    commit_token_threshold: 12000
    keep_recent_turn_count: 3
    retained_message_token_budget: 12000
    max_live_messages: 200
    max_live_bytes: 2097152
    max_segment_messages: 500
    max_segment_bytes: 1048576
    max_segment_tokens: 12000
    semantic_boundary_min_ratio: 0.6
    max_inline_tool_result_bytes: 65536
    max_tool_result_summary_chars: 4000

  summary:
    max_input_chars: 2000000
    max_output_tokens: 4096
    max_file_bytes: 2097152
    max_files_per_conversation: 10000

  summary_vector_store:
    route:
      provider: volcengine
      adapter: vikingdb
      base_url: ""
      credential_ref: vikingdb
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
    collection: conversation_summaries
    options:
      auth_mode: ak_sk
      schema_mode: managed
      project_name: default
      index_name: default
      region: cn-beijing
      console_url: ""
      credential_headers: {}
      upsert_batch_size: 100
      fetch_batch_size: 64
      delete_batch_size: 100
      search_page_size: 64
      scan_page_size: 64
      max_search_hits: 10000
      max_records: 1000000
      index_sync_timeout_seconds: 60.0
      index_sync_poll_interval_seconds: 1.0

  summary_vector_index:
    max_records: 100000
    max_records_per_conversation: 30000
    max_search_hits: 10000
    max_record_chars: 16000
    embedding_batch_size: 128
    stale_retries: 2
    candidate_multiplier: 4
    min_vector_candidates: 20
    max_rerank_candidates: 50
    max_rerank_document_chars: 12000
    vector_score_threshold: -1.0
    rerank_score_threshold: 0.0

  lifecycle:
    maintenance_interval_seconds: 3600
    max_conversations_per_cycle: 100
    lease_ttl_seconds: 300
    heartbeat_interval_seconds: 60.0
    shutdown_timeout_seconds: 30.0
    summary_compaction:
      enabled: true
      segment_to_range:
        min_age_days: 7
        min_source_count: 20
        max_wait_days: 180
        max_source_count: 100
        max_source_chars: 500000
      range_to_archive:
        min_age_days: 180
        min_source_count: 2
        max_source_count: 24
        max_source_chars: 500000
      superseded_source_retention_days: 30
      cleanup_batch_size: 100

memory:
  document:
    max_markdown_body_chars: 6000
    max_encoded_bytes: 128000
    max_relations_per_document: 512

  intention_review:
    first_review_after_days: 30
    second_review_after_days: 60
    strong_review_after_days: 180

  tree:
    max_children_per_directory: 10000

  snapshot:
    max_items: 64
    max_item_bytes: 256000
    max_total_bytes: 4000000

  search_service:
    default_limit: 10
    max_limit: 20
    candidate_multiplier: 4
    max_query_chars: 5000
    max_planned_queries: 4
    max_planned_query_chars: 2000
    max_query_intent_chars: 500
    max_summary_context_chars: 30000
    max_recent_messages: 5
    max_recent_message_chars: 4000
    max_target_context_chars: 8000
    max_planner_context_chars: 70000
    planner_max_output_tokens: 2000
    max_target_roots: 16
    max_relation_neighbors_per_match: 5
    max_relation_neighbors_total: 32
    max_context_chars: 120000
    retrieval_grader_max_context_chars: 120000
    retrieval_grader_max_output_tokens: 1000
    retrieval_grader_max_reason_chars: 1000
    retrieval_grader_max_missing_items: 3
    retrieval_grader_max_missing_item_chars: 1000
    summary_fallback_enabled: true
    summary_fallback_limit: 3
    summary_fallback_max_query_chars: 2000
    summary_fallback_max_context_chars: 24000

  recall_lifecycle:
    enabled: true
    ranking_alpha: 0.2
    cold_threshold: 0.2
    hot_threshold: 0.6
    profile_half_life_days: 180.0
    preference_half_life_days: 90.0
    entity_half_life_days: 60.0
    tool_half_life_days: 30.0
    event_half_life_days: 14.0
    intention_half_life_days: 30.0
    sqlite_timeout_seconds: 5.0
    max_batch_size: 1000
    max_successful_recall_count: 1000000000

  retrieval:
    max_query_chars: 5000
    max_prompt_chars: 1000
    max_completion_chars: 500
    max_tool_message_chars: 500
    search_limit: 5
    max_tool_uris: 32

  vector_store:
    route:
      provider: volcengine
      adapter: vikingdb
      base_url: ""
      credential_ref: vikingdb
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
    collection: memory
    options:
      auth_mode: ak_sk
      schema_mode: managed
      project_name: default
      index_name: default
      region: cn-beijing
      console_url: ""
      credential_headers: {}
      upsert_batch_size: 100
      fetch_batch_size: 64
      delete_batch_size: 100
      search_page_size: 64
      scan_page_size: 64
      max_search_hits: 10000
      max_records: 1000000
      index_sync_timeout_seconds: 60.0
      index_sync_poll_interval_seconds: 1.0

  vector_index:
    max_records: 10000
    max_direct_entries: 1000
    max_directories: 2000
    max_search_hits: 10000
    max_record_chars: 16000
    embedding_batch_size: 128
    stale_retries: 2

  semantic_search:
    mode: hierarchical
    candidate_multiplier: 4
    min_vector_candidates: 20
    directory_candidates: 20
    child_candidates: 32
    max_directory_expansions: 128
    max_rerank_candidates: 50
    max_rerank_document_chars: 12000
    vector_score_threshold: 0.0
    rerank_score_threshold: 0.2
    score_propagation_alpha: 0.8
    rerank_hierarchy: false

  extraction:
    max_retrieval_iterations: 3
    additional_search_limit: 5
    max_query_chars: 5000
    max_old_memory_items: 64
    max_old_memory_bytes: 4000000
    max_old_memory_tokens: 28000
    max_context_chars: 1000000
    max_input_tokens: 56000
    max_observation_chars: 12000
    max_relation_neighbors_per_seed: 8
    max_relation_neighbors_total: 32
    grader_max_output_tokens: 1000
    candidate_max_output_tokens: 8000

  commit:
    lock_ttl_seconds: 30

  transaction_journal:
    max_record_bytes: 33554432
    max_records: 1000

  semantic:
    max_direct_entries: 256
    max_rebuild_directories: 10000
    max_prompt_chars: 120000
    max_entry_summary_chars: 1000
    max_directory_summary_chars: 2000
    max_overview_chars: 64000
    max_abstract_chars: 800
    lock_ttl_seconds: 120
    stale_retries: 1

workflow:
  jobs:
    max_attempts: 5
    max_file_bytes: 65536
    max_files: 100000
    lease_ttl_seconds: 120
    retry_base_delay_seconds: 1.0
    retry_max_delay_seconds: 60.0
    lock_ttl_seconds: 30
    lock_wait_timeout_seconds: 5.0
    lock_retry_delay_seconds: 0.01
  receipts:
    max_file_bytes: 4194304
    max_files: 100000
  lifecycle:
    committed_job_retention_days: 30
    committed_receipt_retention_days: 365
    cleanup_batch_size: 100
  worker:
    poll_interval_seconds: 0.2
    heartbeat_interval_seconds: 10.0
    shutdown_timeout_seconds: 30.0
