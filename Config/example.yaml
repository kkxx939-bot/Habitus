# Habitus 启动时只读取一次该结构；用户副本可在 credentials 中保存真实密钥。
storage:
  root: ~/.habitus
  sqlite_lock:
    timeout_seconds: 5.0

# 真实凭据只写入 ~/.habitus/config.yaml；该文件及备份必须保持 0600。
# 空值可用于生成模板，但 Doctor 和 Runtime 会拒绝被引用的空秘密。
credentials:
  deepseek:
    api_key: ""
  ark:
    api_key: ""
  dashscope:
    api_key: ""
  vikingdb:
    access_key: ""
    secret_key: ""

http:
  host: 127.0.0.1
  port: 8787
  max_request_bytes: 16777216

observability:
  metrics:
    enabled: true
    namespace: habitus
    max_recent_events: 512
    duration_buckets_seconds: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0]
  logging:
    enabled: true
    level: INFO
  tracing:
    enabled: false
    endpoint: http://127.0.0.1:4318
    protocol: http
    service_name: habitus
    insecure: true
    credential_ref: ""
    export_interval_seconds: 10.0
  audit:
    enabled: true
    retention_days: 14
    max_records: 10000
  lock_warning_seconds: 300.0

models:
  chat:
    route:
      provider: deepseek
      adapter: openai_compatible_chat
      model: deepseek-chat
      base_url: https://api.deepseek.com
      credential_ref: deepseek
      # 行为融合一段几十条片段要模型输出整张逐帧归属表，30s 对日尺度数据第一次就超时（实测）。
      timeout_seconds: 300.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body: {}
    context_window_tokens: 64000
    # 留空走厂商默认 4096，行为融合的逐帧归属表会更早被截断；取 deepseek-chat 的上限。
    max_output_tokens: 8192
    structured_output_mode: json_object
    reasoning: false

  embedding:
    route:
      provider: volcengine
      adapter: ark_multimodal
      model: doubao-embedding-vision-251215
      base_url: https://ark.cn-beijing.volces.com/api/v3
      credential_ref: ark
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body: {}
    dimension: 1024
    input_mode: multimodal
    max_batch_size: 32
    max_input_chars: 16000
    query_parameters: {}
    document_parameters: {}

  rerank:
    route:
      provider: aliyun
      adapter: openai_compatible_rerank
      model: qwen3-rerank
      # 替换为创建 API Key 时显示的 API Host；华北 2（北京）需填真实 WorkspaceId。
      base_url: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-api/v1
      credential_ref: dashscope
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 8
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body:
        instruct: Given a web search query, retrieve relevant passages that answer the query.
    max_documents: 100
    max_query_chars: 8000
    max_document_chars: 16000

  structured_output:
    allow_json_repair: true
    validation_retries: 1

conversation:
  journal:
    max_file_bytes: 67108864
    max_history_files: 10000
    max_conversation_tree_entries: 100000
    max_ingress_receipts: 100000
    max_ingress_receipt_bytes: 16384
    lock_ttl_seconds: 30
    lock_wait_timeout_seconds: 5.0
    lock_retry_delay_seconds: 0.01

  source:
    max_envelope_bytes: 16777216
    max_source_files: 100000
    max_output_files_per_consumer: 4
    max_outcome_bytes: 65536
    max_memory_output_bytes: 33554432
    recovery_batch_size: 100
    execution_lock_ttl_seconds: 300
    execution_lock_heartbeat_seconds: 60.0
    execution_lock_wait_seconds: 30.0
    shutdown_timeout_seconds: 30.0

  behavior_projection:
    max_projection_output_bytes: 16777216
    max_projection_items: 100000

  segmentation:
    commit_token_threshold: 12000
    keep_recent_turn_count: 3
    retained_message_token_budget: 12000
    max_live_messages: 200
    max_live_bytes: 2097152
    max_segment_messages: 500
    max_segment_bytes: 1048576
    max_segment_tokens: 12000
    semantic_boundary_min_ratio: 0.6
    max_inline_tool_result_bytes: 65536
    max_tool_result_summary_chars: 4000

  summary:
    max_input_chars: 2000000
    max_output_tokens: 4096
    max_file_bytes: 2097152
    max_files_per_conversation: 10000

  summary_vector_store:
    route:
      provider: volcengine
      adapter: vikingdb
      base_url: ""
      credential_ref: vikingdb
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
    collection: conversation_summaries
    options:
      auth_mode: ak_sk
      schema_mode: managed
      project_name: default
      index_name: default
      region: cn-beijing
      console_url: ""
      credential_headers: {}
      upsert_batch_size: 100
      fetch_batch_size: 64
      delete_batch_size: 100
      search_page_size: 64
      scan_page_size: 64
      max_search_hits: 10000
      max_records: 1000000
      index_sync_timeout_seconds: 60.0
      index_sync_poll_interval_seconds: 1.0

  summary_vector_index:
    max_records: 100000
    max_records_per_conversation: 30000
    max_search_hits: 10000
    max_record_chars: 16000
    embedding_batch_size: 128
    stale_retries: 2
    candidate_multiplier: 4
    min_vector_candidates: 20
    max_rerank_candidates: 50
    max_rerank_document_chars: 12000
    vector_score_threshold: -1.0
    rerank_score_threshold: 0.0

  lifecycle:
    maintenance_interval_seconds: 3600
    max_conversations_per_cycle: 100
    lease_ttl_seconds: 300
    heartbeat_interval_seconds: 60.0
    shutdown_timeout_seconds: 30.0
    summary_compaction:
      enabled: true
      segment_to_range:
        min_age_days: 7
        min_source_count: 20
        max_wait_days: 180
        max_source_count: 100
        max_source_chars: 500000
      range_to_archive:
        min_age_days: 180
        min_source_count: 2
        max_source_count: 24
        max_source_chars: 500000
      recent_use_protection_days: 90
      archive_retire_days: 1095
      archive_retire_grace_days: 90
      cleanup_batch_size: 100

memory:
  document:
    max_markdown_body_chars: 6000
    max_encoded_bytes: 128000
    max_relations_per_document: 512

  intention_review:
    first_review_after_days: 30
    second_review_after_days: 60
    strong_review_after_days: 180

  tree:
    max_children_per_directory: 10000

  snapshot:
    max_items: 64
    max_item_bytes: 256000
    max_total_bytes: 4000000

  search_service:
    default_limit: 10
    max_limit: 20
    candidate_multiplier: 4
    max_query_chars: 5000
    max_planned_queries: 4
    max_planned_query_chars: 2000
    max_query_intent_chars: 500
    max_summary_context_chars: 30000
    max_recent_messages: 5
    max_recent_message_chars: 4000
    max_target_context_chars: 8000
    max_planner_context_chars: 70000
    planner_max_output_tokens: 2000
    max_target_roots: 16
    max_relation_neighbors_per_match: 5
    max_relation_neighbors_total: 32
    max_context_chars: 120000
    retrieval_grader_max_context_chars: 120000
    retrieval_grader_max_output_tokens: 1000
    retrieval_grader_max_reason_chars: 1000
    retrieval_grader_max_missing_items: 3
    retrieval_grader_max_missing_item_chars: 1000
    summary_fallback_enabled: true
    summary_fallback_limit: 3
    summary_fallback_max_query_chars: 2000
    summary_fallback_max_context_chars: 24000

  recall_lifecycle:
    enabled: true
    ranking_alpha: 0.2
    cold2_threshold: 0.08
    cold1_threshold: 0.2
    hot_threshold: 0.6
    profile_half_life_days: 180.0
    preference_half_life_days: 90.0
    entity_half_life_days: 60.0
    tool_half_life_days: 30.0
    event_half_life_days: 14.0
    intention_half_life_days: 30.0
    profile_retire_days: 720.0
    preference_retire_days: 365.0
    entity_retire_days: 270.0
    tool_retire_days: 180.0
    event_retire_days: 180.0
    intention_retire_days: 540.0
    retire_candidate_grace_days: 30.0
    cold2_probe_interval_days: 30.0
    cold2_probe_limit: 2
    max_cold2_probes_per_search: 1
    sqlite_timeout_seconds: 5.0
    max_batch_size: 1000
    max_useful_recall_count: 1000000000

  field_compaction:
    max_input_chars: 2000000
    max_output_tokens: 4096
    max_field_chars: 1000000

  lifecycle_maintenance:
    max_scan_items: 256
    max_compactions_per_cycle: 4
    max_retirements_per_cycle: 4

  retrieval:
    max_query_chars: 5000
    max_prompt_chars: 1000
    max_completion_chars: 500
    max_tool_message_chars: 500
    search_limit: 5
    max_tool_uris: 32

  vector_store:
    route:
      provider: volcengine
      adapter: vikingdb
      base_url: ""
      credential_ref: vikingdb
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
    collection: memory
    options:
      auth_mode: ak_sk
      schema_mode: managed
      project_name: default
      index_name: default
      region: cn-beijing
      console_url: ""
      credential_headers: {}
      upsert_batch_size: 100
      fetch_batch_size: 64
      delete_batch_size: 100
      search_page_size: 64
      scan_page_size: 64
      max_search_hits: 10000
      max_records: 1000000
      index_sync_timeout_seconds: 60.0
      index_sync_poll_interval_seconds: 1.0

  vector_index:
    max_records: 10000
    max_direct_entries: 1000
    max_directories: 2000
    max_search_hits: 10000
    max_record_chars: 16000
    embedding_batch_size: 128
    stale_retries: 2

  semantic_search:
    mode: hierarchical
    candidate_multiplier: 4
    min_vector_candidates: 20
    directory_candidates: 20
    child_candidates: 32
    max_directory_expansions: 128
    max_rerank_candidates: 50
    max_rerank_document_chars: 12000
    vector_score_threshold: 0.0
    rerank_score_threshold: 0.2
    score_propagation_alpha: 0.8
    rerank_hierarchy: false

  extraction:
    max_retrieval_iterations: 3
    additional_search_limit: 5
    max_query_chars: 5000
    max_old_memory_items: 64
    max_old_memory_bytes: 4000000
    max_old_memory_tokens: 28000
    max_context_chars: 1000000
    max_input_tokens: 56000
    max_observation_chars: 12000
    max_relation_neighbors_per_seed: 8
    max_relation_neighbors_total: 32
    grader_max_output_tokens: 1000
    candidate_max_output_tokens: 8000

  commit:
    lock_ttl_seconds: 30

  transaction_journal:
    max_record_bytes: 33554432
    max_records: 1000

  semantic:
    max_direct_entries: 256
    max_rebuild_directories: 10000
    max_prompt_chars: 120000
    max_entry_summary_chars: 1000
    max_directory_summary_chars: 2000
    max_overview_chars: 64000
    max_abstract_chars: 800
    lock_ttl_seconds: 120
    stale_retries: 1

workflow:
  jobs:
    max_attempts: 5
    max_file_bytes: 65536
    max_files: 100000
    lease_ttl_seconds: 120
    retry_base_delay_seconds: 1.0
    retry_max_delay_seconds: 60.0
    lock_ttl_seconds: 30
    lock_wait_timeout_seconds: 5.0
    lock_retry_delay_seconds: 0.01
  receipts:
    max_file_bytes: 4194304
    max_files: 100000
  lifecycle:
    committed_job_retention_days: 30
    committed_receipt_retention_days: 365
    cleanup_batch_size: 100
  worker:
    poll_interval_seconds: 0.2
    heartbeat_interval_seconds: 10.0
    shutdown_timeout_seconds: 30.0

# 行为管线（观测 → 融合 → 归约 → 行为树）。缺省未启用；填入被跟踪主体的稳定标识即启用，
# Runtime 会组装行为组件并启动融合/归约两个常驻 Worker。窗口数值留空时取代码内唯一出处。
# behavior:
#   primary_subject: "家庭成员A"
#   context_limit: 8
#   context_lookback_seconds: 3600
#   reduction_sweep_interval_seconds: 300
#   fusion_poll_interval_seconds: 5
#   worker_shutdown_timeout_seconds: 30
#   coverage_window_days: 7            # 覆盖索引/回执/账本的过期窗口 = 上游最大补发跨度
#   max_fragments_per_segment: 60      # 一次融合的段容量；8k 输出预算下实测 60 条才稳
#   # 行为类型词表（BHV-KINDS-002）；留空取 behavior/kinds/config.py 的默认值
#   kinds_batch_size: 10               # 一次归一调用判几个未知名字
#   kinds_vector_candidates: 30        # 每个名字的候选：embedding 最近邻取几个
#   kinds_frequent_candidates: 20      # 再并上命中天数最多的几个
#   kinds_base_days: 30                # 存活期基础天数：一次性名字这么久没再命中就删
#   kinds_gap_multiplier: 3            # 周期行为按 自己最长命中间隔 × 倍数 续命
#   kinds_literal_candidates: 30       # embedding 不可用时字面重合取几个候选
#   kinds_validation_rounds: 2         # 违约名字的重问轮数（每轮只重问违约的）
#   kinds_max_kinds: 10000             # 词表条目上限（护栏）
#   kinds_max_aliases_per_kind: 200    # 每类别名上限（护栏）
#   kinds_max_encoded_bytes: 16777216  # kinds.md 字节上限；一条满账条目≈1KB，要盖住 max_kinds 条
#   kinds_transient_retries: 5         # 归一调用对超时/断连的有界重试
#   kinds_transient_retry_delay_seconds: 5

# 时间预测树的夜批。缺省未启用；置 enabled: true 即启用，Runtime 会在行为侧也启用时组装
# 重建 Worker（这棵树读的就是行为树，行为侧没开就没有输入）。
#
# 下面十三个值**全部是启动档，没有一个有数据依据**（见 prediction/config.py 的
# TODO(PRED-TUNING-001)）。它们要用 prediction/evaluation.py 的留出回测在我们自己的数据上
# 逐项定档，判据以校准为主。在第一批真实 occurrence 出来之前，不要为了"看起来更合理"提前改。
# prediction:
#   enabled: true
#   slot_minutes: 15                 # 待定档：min(提醒精度目标, 链内相邻间隔低分位)
#   decay_half_life_days: 60         # 待定档：行为分布的稳定期长度
#   recent_half_life_days: 14        # 待定档：多快认出习惯变化而不被单周波动骗到；必须短于上一行
#   pool_half_width: 2               # 待定档：同一习惯的日间时间抖动（单位是槽）
#   shrink_slot_to_pool: 5           # 待定档：留出集上最小化对数损失
#   shrink_pool_to_weekday: 5        # 待定档：同上
#   shrink_weekday_to_all_day: 5     # 待定档：同上
#   laplace_epsilon: 0.5             # 待定档：边的目标份额平滑
#   transition_window_seconds: 1800  # 待定档：链内/链间间隔的双峰谷底（最依赖真实数据）
#   shrink_edge: 5                   # 待定档：留出集上最小化对数损失
#   recurrence_window_days: 90       # 待定档：超过多久算"重新开始"而不是"复发"
#   recurrence_half_life_days: 365   # 待定档：复发证据窗必须比钟面长——月频行为在 τ=60 下有效样本封顶 3.4 个
#   rebuild_interval_seconds: 86400  # 运维数：一天重建一次
#   published_generations: 7         # 运维数：留七代，够回看一周
#   worker_shutdown_timeout_seconds: 30
