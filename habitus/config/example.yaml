# Habitus 启动时只读取一次该结构；用户副本可在 credentials 中保存真实密钥。
storage:
  root: ~/.habitus
  sqlite_lock:
    timeout_seconds: 5.0

# 真实凭据只写入 ~/.habitus/config.yaml；该文件及备份必须保持 0600。
# 空值可用于生成模板，但 Doctor 和 Runtime 会拒绝被引用的空秘密。
credentials:
  deepseek:
    api_key: ""
  ark:
    api_key: ""
  dashscope:
    api_key: ""
  vikingdb:
    access_key: ""
    secret_key: ""

http:
  host: 127.0.0.1
  port: 8787
  max_request_bytes: 16777216

observability:
  metrics:
    enabled: true
    namespace: habitus
    max_recent_events: 512
    duration_buckets_seconds: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0]
  logging:
    enabled: true
    level: INFO
  tracing:
    enabled: false
    endpoint: http://127.0.0.1:4318
    protocol: http
    service_name: habitus
    insecure: true
    credential_ref: ""
    export_interval_seconds: 10.0
  audit:
    enabled: true
    retention_days: 14
    max_records: 10000
  lock_warning_seconds: 300.0

models:
  chat:
    route:
      provider: deepseek
      adapter: openai_compatible_chat
      model: deepseek-chat
      base_url: https://api.deepseek.com
      credential_ref: deepseek
      # 行为融合一段几十条片段要模型输出整张逐帧归属表，30s 对日尺度数据第一次就超时（实测）。
      timeout_seconds: 300.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body: {}
    context_window_tokens: 64000
    # 留空走厂商默认 4096，行为融合的逐帧归属表会更早被截断；取 deepseek-chat 的上限。
    max_output_tokens: 8192
    structured_output_mode: json_object
    reasoning: false

  embedding:
    route:
      provider: volcengine
      adapter: ark_multimodal
      model: doubao-embedding-vision-251215
      base_url: https://ark.cn-beijing.volces.com/api/v3
      credential_ref: ark
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body: {}
    dimension: 1024
    input_mode: multimodal
    max_batch_size: 32
    max_input_chars: 16000
    query_parameters: {}
    document_parameters: {}

  rerank:
    route:
      provider: aliyun
      adapter: openai_compatible_rerank
      model: qwen3-rerank
      # 替换为创建 API Key 时显示的 API Host；华北 2（北京）需填真实 WorkspaceId。
      base_url: https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-api/v1
      credential_ref: dashscope
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 8
      max_response_bytes: 8388608
      extra_headers: {}
      extra_body:
        instruct: Given a web search query, retrieve relevant passages that answer the query.
    max_documents: 100
    max_query_chars: 8000
    max_document_chars: 16000

  structured_output:
    allow_json_repair: true
    validation_retries: 1

conversation:
  journal:
    max_file_bytes: 67108864
    max_history_files: 10000
    max_conversation_tree_entries: 100000
    max_ingress_receipts: 100000
    max_ingress_receipt_bytes: 16384
    lock_ttl_seconds: 30
    lock_wait_timeout_seconds: 5.0
    lock_retry_delay_seconds: 0.01

  source:
    max_envelope_bytes: 16777216
    max_source_addresses: 100000
    max_markers_per_address: 10000
    max_pending_sources: 100000
    max_output_files_per_consumer: 4
    max_outcome_bytes: 65536
    max_memory_output_bytes: 33554432
    max_behavior_session_output_bytes: 1048576   # 行为侧会话 lane 的回执（只列各轮时刻，不存内容）
    recovery_batch_size: 100
    release_batch_addresses: 1000                # 释放每轮最多看多少个地址（按地址游标轮转）
    orphan_grace_seconds: 86400                  # 标记打上后信封迟迟不在多久算孤儿（put 写到一半崩溃），周期恢复清掉
    execution_lock_ttl_seconds: 300
    execution_lock_heartbeat_seconds: 60.0
    execution_lock_wait_seconds: 30.0
    shutdown_timeout_seconds: 30.0

  segmentation:
    commit_token_threshold: 12000
    keep_recent_turn_count: 3
    retained_message_token_budget: 12000
    max_live_messages: 200
    max_live_bytes: 2097152
    max_segment_messages: 500
    max_segment_bytes: 1048576
    max_segment_tokens: 12000
    semantic_boundary_min_ratio: 0.6
    max_inline_tool_result_bytes: 65536
    max_tool_result_summary_chars: 4000

  summary:
    max_input_chars: 2000000
    max_output_tokens: 4096
    max_file_bytes: 2097152
    max_files_per_conversation: 10000

  summary_vector_store:
    route:
      provider: volcengine
      adapter: vikingdb
      base_url: ""
      credential_ref: vikingdb
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
    collection: conversation_summaries
    options:
      auth_mode: ak_sk
      schema_mode: managed
      project_name: default
      index_name: default
      region: cn-beijing
      console_url: ""
      credential_headers: {}
      upsert_batch_size: 100
      fetch_batch_size: 64
      delete_batch_size: 100
      search_page_size: 64
      scan_page_size: 64
      max_search_hits: 10000
      max_records: 1000000
      index_sync_timeout_seconds: 60.0
      index_sync_poll_interval_seconds: 1.0

  summary_vector_index:
    max_records: 100000
    max_records_per_conversation: 30000
    max_search_hits: 10000
    max_record_chars: 16000
    embedding_batch_size: 128
    stale_retries: 2
    candidate_multiplier: 4
    min_vector_candidates: 20
    max_rerank_candidates: 50
    max_rerank_document_chars: 12000
    vector_score_threshold: -1.0
    rerank_score_threshold: 0.0

  lifecycle:
    max_conversations_per_cycle: 100
    summary_compaction:
      enabled: true
      segment_to_range:
        min_age_days: 7
        min_source_count: 20
        max_wait_days: 180
        max_source_count: 100
        max_source_chars: 500000
      range_to_archive:
        min_age_days: 180
        min_source_count: 2
        max_source_count: 24
        max_source_chars: 500000
      recent_use_protection_days: 90
      archive_retire_days: 1095
      archive_retire_grace_days: 90
      cleanup_batch_size: 100

memory:
  document:
    max_markdown_body_chars: 6000
    max_encoded_bytes: 128000
    max_relations_per_document: 512

  intention_review:
    first_review_after_days: 30
    second_review_after_days: 60
    strong_review_after_days: 180

  tree:
    max_children_per_directory: 10000

  snapshot:
    max_items: 64
    max_item_bytes: 256000
    max_total_bytes: 4000000

  search_service:
    default_limit: 10
    max_limit: 20
    candidate_multiplier: 4
    max_query_chars: 5000
    max_planned_queries: 4
    max_planned_query_chars: 2000
    max_query_intent_chars: 500
    max_summary_context_chars: 30000
    max_recent_messages: 5
    max_recent_message_chars: 4000
    max_target_context_chars: 8000
    max_planner_context_chars: 70000
    planner_max_output_tokens: 2000
    max_target_roots: 16
    max_relation_neighbors_per_match: 5
    max_relation_neighbors_total: 32
    max_context_chars: 120000
    retrieval_grader_max_context_chars: 120000
    retrieval_grader_max_output_tokens: 1000
    retrieval_grader_max_reason_chars: 1000
    retrieval_grader_max_missing_items: 3
    retrieval_grader_max_missing_item_chars: 1000
    summary_fallback_enabled: true
    summary_fallback_limit: 3
    summary_fallback_max_query_chars: 2000
    summary_fallback_max_context_chars: 24000

  recall_lifecycle:
    enabled: true
    ranking_alpha: 0.2
    cold2_threshold: 0.08
    cold1_threshold: 0.2
    hot_threshold: 0.6
    profile_half_life_days: 180.0
    preference_half_life_days: 90.0
    entity_half_life_days: 60.0
    tool_half_life_days: 30.0
    event_half_life_days: 14.0
    intention_half_life_days: 30.0
    profile_retire_days: 720.0
    preference_retire_days: 365.0
    entity_retire_days: 270.0
    tool_retire_days: 180.0
    event_retire_days: 180.0
    intention_retire_days: 540.0
    retire_candidate_grace_days: 30.0
    cold2_probe_interval_days: 30.0
    cold2_probe_limit: 2
    max_cold2_probes_per_search: 1
    sqlite_timeout_seconds: 5.0
    max_batch_size: 1000
    max_useful_recall_count: 1000000000

  field_compaction:
    max_input_chars: 2000000
    max_output_tokens: 4096
    max_field_chars: 1000000

  lifecycle_maintenance:
    max_scan_items: 256
    max_compactions_per_cycle: 4
    max_retirements_per_cycle: 4

  retrieval:
    max_query_chars: 5000
    max_prompt_chars: 1000
    max_completion_chars: 500
    max_tool_message_chars: 500
    search_limit: 5
    max_tool_uris: 32

  vector_store:
    route:
      provider: volcengine
      adapter: vikingdb
      base_url: ""
      credential_ref: vikingdb
      timeout_seconds: 30.0
      max_retries: 2
      retry_base_delay_seconds: 0.5
      retry_max_delay_seconds: 30.0
      max_concurrent: 16
      max_response_bytes: 8388608
      extra_headers: {}
    collection: memory
    options:
      auth_mode: ak_sk
      schema_mode: managed
      project_name: default
      index_name: default
      region: cn-beijing
      console_url: ""
      credential_headers: {}
      upsert_batch_size: 100
      fetch_batch_size: 64
      delete_batch_size: 100
      search_page_size: 64
      scan_page_size: 64
      max_search_hits: 10000
      max_records: 1000000
      index_sync_timeout_seconds: 60.0
      index_sync_poll_interval_seconds: 1.0

  vector_index:
    max_records: 10000
    max_direct_entries: 1000
    max_directories: 2000
    max_search_hits: 10000
    max_record_chars: 16000
    embedding_batch_size: 128
    stale_retries: 2

  semantic_search:
    mode: hierarchical
    candidate_multiplier: 4
    min_vector_candidates: 20
    directory_candidates: 20
    child_candidates: 32
    max_directory_expansions: 128
    max_rerank_candidates: 50
    max_rerank_document_chars: 12000
    vector_score_threshold: 0.0
    rerank_score_threshold: 0.2
    score_propagation_alpha: 0.8
    rerank_hierarchy: false

  extraction:
    max_retrieval_iterations: 3
    additional_search_limit: 5
    max_query_chars: 5000
    max_old_memory_items: 64
    max_old_memory_bytes: 4000000
    max_old_memory_tokens: 28000
    max_context_chars: 1000000
    max_input_tokens: 56000
    max_observation_chars: 12000
    max_relation_neighbors_per_seed: 8
    max_relation_neighbors_total: 32
    grader_max_output_tokens: 1000
    candidate_max_output_tokens: 8000

  commit:
    lock_ttl_seconds: 30

  transaction_journal:
    max_record_bytes: 33554432
    max_records: 1000

  semantic:
    max_direct_entries: 256
    max_rebuild_directories: 10000
    max_prompt_chars: 120000
    max_entry_summary_chars: 1000
    max_directory_summary_chars: 2000
    max_overview_chars: 64000
    max_abstract_chars: 800
    lock_ttl_seconds: 120
    stale_retries: 1

workflow:
  jobs:
    max_attempts: 5
    max_file_bytes: 65536
    max_files: 100000
    lease_ttl_seconds: 120
    retry_base_delay_seconds: 1.0
    retry_max_delay_seconds: 60.0
    lock_ttl_seconds: 30
    lock_wait_timeout_seconds: 5.0
    lock_retry_delay_seconds: 0.01
  receipts:
    max_file_bytes: 4194304
    max_files: 100000
  lifecycle:
    committed_job_retention_days: 30
    committed_receipt_retention_days: 365
    cleanup_batch_size: 100
  worker:
    poll_interval_seconds: 0.2
    heartbeat_interval_seconds: 10.0
    shutdown_timeout_seconds: 30.0

# 行为管线（两条 lane 的融合 → 归约 → 行为树）。缺省未启用；填入被跟踪主体的稳定标识即启用。
# 会话、物理两条 lane 各是一整套（存储、归约、行为树、词表各一支，在 <根>/behavior/<lane>/ 等目录下），
# 互不相通；下面的设置两支共用同一份数值。窗口数值留空时取代码内唯一出处。
# behavior:
#   primary_subject: "家庭成员A"
#   context_lookback_seconds: 3600     # 归约的封口视界：证据齐备之后过这么久才封口落树
#   reduction_sweep_interval_seconds: 300
#   reduction_sweep_lock_ttl_seconds: 600   # 归约 sweep 的租约时长；周尺度回填可调大（默认 600）
#   worker_shutdown_timeout_seconds: 30
#   coverage_window_days: 7            # 重做去重的判据；覆盖记录/回执/账本的过期期限（覆盖记录在其凭据释放前不过期）
#   retry_backlog_max: 500             # 每晚重试的堆每一支最多几项（保护闸）；满了新来的只落「没读懂」
#   # 会话 lane 的保护上限；留空取 behavior/fusion/lanes/session/config.py 的默认值
#   session_max_turn_chars: 8000       # 一轮对话给模型的材料总字数上限（超出先削工具调用中段，人的指令最后才削）
#   session_max_instruction_chars: 4000  # 人的那条指令最多留多少字
#   session_max_steps: 3               # 每轮写出来的步骤最多几条
#   # 基础词表（裁定 6：门槛全部是配置）；留空取 behavior/kinds/config.py 的默认值。标"待定档"的要等真实数据重定
#   kinds_batch_size: 10               # 白天归类一次调用判几条
#   kinds_validation_rounds: 2         # 没答好的条目重问几轮（每轮只问没答好的），用尽当「待定」
#   kinds_transient_retries: 5         # 模型调用对超时/断连的有界重试
#   kinds_transient_retry_delay_seconds: 5
#   kinds_max_encoded_bytes: 16777216  # 词表各文件（清单、变更日志、待定池……）的字节上限
#   kinds_max_examples: 3              # 每类最多几条代表例子
#   kinds_recurrence_min_count: 2      # 每晚新增：一组待定至少几条才建类；拆分两边也按它（裁定 59）
#   kinds_recurrence_min_days: 2       # 每晚新增：且至少跨几天（同一天追问几轮不算复现）；拆分同上
#   kinds_max_pending: 5000            # 待定池上限（保护闸）
#   kinds_nightly_max_new: 200         # 每晚新增一晚最多交几条新条目（保护闸，多的留到下一晚；旧条目不进，按相似召回）
#   kinds_recall_per_entry: 3          # 每条新条目按字符二元组相似召回几条旧条目一起聚组
#   kinds_nightly_hour: 2              # 每晚新增在本地几点之后跑
#   kinds_revision_weekday: 2          # 定期拆改在每周几（0=周一，2=周三）
#   kinds_revision_hour: 3             # 定期拆改在本地几点之后跑
#   kinds_merge_evidence_runs: 2       # 合并要在连续几个拆改周期里都被提出才算有证据（裁定 17）
#   kinds_cooldown_days: 14            # 改过的类冷却几天（待定档）
#   kinds_max_changes_per_revision: 3  # 一次拆改最多改几处（待定档）
#   kinds_lane_candidate_cap: 80       # 同 lane 在用类超过这个数就报警（保护闸；以后接回向量召回）
#   kinds_anchors_per_class: 8         # 定期拆改锚点自检：每个没动过的类取几个锚点（裁定 17）
#   kinds_max_anchor_pull: 0.02        # 锚点自检：新清单下被拉走的锚点最多占几成（裁定 17）
#   kinds_revision_samples_per_class: 8  # 拆改提合并 / 改判据时每类给模型看几条原话
#   kinds_revision_window_days: 120    # 拆改分组定拆：只看每个类最近多少天的成员（按月做的事要攒够 3 次）
#   kinds_grouping_min_members: 6      # 成员少于这个数的类不分组（实际门槛至少是两边各 recurrence_min_count 条）
#   kinds_grouping_batch_size: 60      # 一次分组最多给模型看几条，多了分批、后一批看得见前几批的组
#   kinds_checkpoint_every: 200        # 扫树、重打树时每处理多少条续一次 sweep 租约
#   kinds_prompt_max_steps: 12         # 归类与待定池给模型看的每条最多列几步
#   kinds_sample_max_steps: 4          # 定期拆改抽样原话每条最多列几步
#   observation_max_files: 100000      # 观测存储最多多少份交付（保护闸；观测在发布后即释放，常态远低于它）
#   fusion_max_receipt_files: 100000   # 回执最多多少份（保护闸；按覆盖窗口过期）
#   fusion_max_judgement_files: 1000000  # 判断最多多少份（保护闸；发布即释放）
#   tree_max_children_per_directory: 10000  # 行为树单个目录最多多少个子项（保护闸）

# 语义关联层。缺省未启用；置 enabled: true 即启用（行为侧必须也启用）。
# relations 是关系检验的统计门槛（裁定 26）：每一项都可以不写，不写就是下面注释里的默认值（用户 10-07 定的起点，
# 跑真实数据后再校）。和时间有关的数（槽宽、转移窗口）只认 temporal 那一组，这里不另配。
# scene:
#   enabled: true
#   baseline_slack_slots: 3          # 常态按峰分份时峰两边各放宽几槽（待定档；原借预测树 pool_half_width，裁定 59）
#   nightly_at: "04:00"             # 整晚那一趟（重试→结算→语义树→机会表）在主体本地几点跑；启动时只补跑错过的那一趟（裁定 67）
#   nightly_shutdown_timeout_seconds: 30  # 停机时等整晚那一趟多久
#   relations:
#     fdr: 0.10                        # 第 1 道：当晚检验族的假发现率
#     forward_alpha: 0.05              # 前向验证的单侧显著性
#     forward_power: 0.80              # 前向验证与维持检验要攒几次按功效定（没有固定下限；前向按发现时效应区间离 0 近的一端算）
#     forward_max_antecedents: 40      #   ……至多攒这么多次
#     min_absolute_lift: 0.05          # 第 3 道"影响够大"：差值区间下限的绝对差
#     min_relative_lift: 0.20          #   ……与相对差（两样都要够）
#     heterogeneity_alpha: 0.05        # 第 2 道：各块效应异质性的显著性
#     interval_level: 0.95             # 差值区间的置信度
#     bootstrap_rounds: 400            #   ……按块重抽样的次数
#     exact_strata_limit: 400          # 有信息的层不超过这么多时 p 值精确算，超过用正态近似
#     first_seen_min_days: 14          # 长跨度"新类第一次出现"：记录开始后至少过这么多天
#     first_seen_min_blocks: 3         #   ……并且至少这么多个这一类自己的块长
#     condition_ask_min_antecedents: 40  # 前因攒到这么多次才问模型要调节条件（机械列举的条件按最小可达 p 开检验，不看它）
#     max_blind_share: 0.5             # 后果是细分概念时，"判不了"的窗口超过这一成就不进检验族
#     max_combined_conditions: 3       # 一条关系最多挂几个条件（第二个起只长在已成立的带条件关系上；保护闸）

# 读行为记录时间用的尺子（裁定 59）：语义树与预测层都经 habitus.temporal 用它们，全系统只此一处。
# temporal:
#   slot_minutes: 15                 # 槽宽，须整除一天（待定档：min(提醒精度目标, 链内相邻间隔低分位)）
#   merge_window_minutes: 45         # 同一类相邻两条开始时刻相隔不超过这么多分钟算同一次（按秒判断）；须是槽宽的整数倍，
#                                    #   关系检验"同一条链"那一段的槽数由它换算
#   pool_half_width: 3               # 日内分布收缩的邻域：本槽 ← 前后各这么多槽 ← 全天（待定档）
#   shrink_slot_to_pool: 5           # 本槽向邻域收缩的先验分量（待定档）
#   shrink_pool_to_all_day: 5        # 邻域向全天收缩的先验分量（待定档）
#   min_peak_mass: 0.10              # 一个峰里至少有这么多比例的发生（归一化之后比）

# 主体所在地。时区与当地日历**两层共用**：语义树与预测层用它取每一天的日历条件（周几、几号、日型），预测层用它
# 造"此刻"的时钟与本地日界。分别配两份迟早对不上，所以单独一组，由组合根分发。
# 这一组没有 enabled：不启用任何上层时它也无害，启用了就必须是对的。
# locale:
#   timezone: Asia/Shanghai          # IANA 名字；决定"今天是哪一天""此刻在哪个槽"
#   region: CN                       # 这个人所在地的地区码（ISO 3166：CN、SG，州一级如 US-CA）；日历跟着人走，不跟着服务部署在哪
#   calendar_path: null              # 放假安排目录（外接组件，<年>.json，格式见 conditions/calendar_data.py）；
#                                    #   null 时没有放假数据：日型是未知（不当普通工作日），周几、几号照常答。
#   nominal_weekend: [5, 6]          # 没有放假数据时建预期的兜底周末（0=周一 … 6=周日）；统计里不用它

# 预测层。缺省未启用；置 enabled: true 即启用（语义树必须已启用——机会表、复现与关系全从语义树那一晚来，
# 结算是整晚那一趟的第一步；预测树删了，裁定 59）。
#
# 这一组没有算法参数：时窗来自历史那几次的实际时刻，转移窗就是 temporal 的 merge_window_minutes / slot_minutes。
# 这里只有开关、递法的升降节奏（产品决定，不是统计量）、保护闸；没定的几项先给默认值（裁定 46）。
# foresight:
#   enabled: true
#   false_alarm_rate: 0.33           # 可接受的误提醒率；线 = 1 − 它（0.33 → 0.67），这一版所有账同一条线
#   shadow_uses_unestablished: true  # 影子预期也用还没成立的候选关系（账早攒；开口仍只用成立的）
#   unseen_day_types: skip           # 没见过的日型怎么建预期：skip 不外推（只在见过他做的日型上建）/ official 按放假数据的官方含义归组（待定，裁定 59）
#   daily_reminder_cap: 10           # 每天最多提醒几次（保护闸，常触发说明线该重看）
#   open_reminders_judged: 5         # 每段会话进融合时最多带几条开着的提醒给模型判回应（按截止由近到远）
#   unit_prior_share: 0.333          # 行为单元分层读数里先验的分量占有效样本上限的比例（没见过的组合贴着更粗那一层；回放后定）
#   judge_transient_retries: 1       # 模型对传输层瞬态错的有界重试
#   judge_transient_retry_delay_seconds: 5.0
