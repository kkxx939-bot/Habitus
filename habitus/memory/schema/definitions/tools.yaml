memory_type: tool
description: >-
  只保存 Agent 实际使用具体工具后形成的稳定工具知识，使后续调用减少重复试错。
  tool_name 必须来自当前 ConversationSegment 中真实 tool_call，并且存在同名、同调用 ID 的成功
  tool_result。用户或 Assistant 的口头描述不能冒充已验证知识，一次偶然成功不能直接泛化为通用规律。
  不保存逐次工具调用流水、临时参数、下载内容、敏感值、调用次数或成功率统计。
path_template: tools/{tool_name}.md
operation_mode: upsert
min_non_empty_content_fields: 1
omit_empty_sections: true
markdown_template: |
  # {tool_name}

  ## Purpose
  {purpose}

  ## When to Use
  {when_to_use}

  ## Stable Invocation
  {invocation}

  ## Constraints
  {constraints}

  ## Failure and Recovery
  {failure_recovery}

  ## Verification
  {verification}
fields:
  - name: tool_name
    type: string
    role: address
    required: true
    merge: immutable
    description: >-
      必须逐字复制当前 ConversationSegment 中真实 tool_call.name，并且能找到同名、同调用 ID 的
      成功 tool_result；不得由 LLM 翻译、概括或改名，也不依赖工具注册表；不把工具知识转换成 Skill。
  - name: purpose
    type: string
    role: content
    required: false
    merge: replace
    description: >-
      工具的稳定用途和能力边界；更新时结合旧内容完整重写。不得仅凭用户或 Assistant 的描述写入，
      也不得把一次偶然成功泛化为未被结果验证的能力。
  - name: when_to_use
    type: string
    role: content
    required: false
    merge: patch
    description: >-
      适合调用该工具的可复用场景、前置条件和不适用场景；必须能由实际调用结果支持，
      不从一次偶然成功推导通用适用范围。
  - name: invocation
    type: string
    role: content
    required: false
    merge: patch
    description: >-
      已由成功 tool_result 验证的参数形态、调用顺序和最小示例；不得记录一次性值、密钥或完整调用流水。
  - name: constraints
    type: string
    role: content
    required: false
    merge: patch
    description: >-
      已由真实调用结果确认的权限、大小、格式、平台、超时或并发限制，不把未经验证的报错猜测写成约束。
  - name: failure_recovery
    type: string
    role: content
    required: false
    merge: patch
    description: >-
      可复现的常见失败模式、判断信号和已验证恢复办法；必须同时存在同名工具的失败结果以及发生在其后
      的成功结果，不保存无结论的偶发错误。
  - name: verification
    type: string
    role: content
    required: false
    merge: patch
    description: >-
      已由成功 tool_result 支持的稳定检查方法和期望结果，不把模型自行设想的检查方式写入。
