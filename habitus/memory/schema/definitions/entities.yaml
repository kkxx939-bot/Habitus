memory_type: entity
description: >-
  为具有可识别稳定名称，并且至少存在一条以后可能再次使用的稳定事实、当前情况或关系的人物、组织、
  地点、作品、产品、动物、项目或概念保存实体卡片。卡片写这个实体是什么、现在是什么情况，以及与用户
  或其他事物的持久关系；情况变了就改写成新的当前情况，不保留变化的过程。一次发生的事、一次会议或
  操作、待办和计划本身不是实体，不为它们建卡片；它们只在改变了某个有稳定名称的实体的当前情况时，
  写进那个实体的卡片，没有可以挂的实体就不记。临时举例、顺带提及或没有可复用事实的普通名词不生成
  Entity。
path_template: entities/{category}/{name}.md
markdown_template: |
  # {name}

  **Category:** {category}

  {summary}

  {details}
fields:
  - name: category
    type: string
    role: address
    required: true
    merge: immutable
    description: >-
      简洁、自然的实体类别，用于目录分组；类别由内容语义产生，不依赖受控 registry。类别说明实体本身
      是什么，不使用表示发生过的事、会议、操作、待办或计划的类别。
  - name: name
    type: string
    role: address
    required: true
    merge: immutable
    description: >-
      用户能够识别且以后可以再次指代的稳定实体名称，保持原有专名，不生成额外文件身份；
      临时示例名称、宽泛普通名词和只出现一次但没有稳定事实的概念不建立实体。
  - name: summary
    type: string
    role: content
    required: true
    merge: replace
    description: >-
      用一个普通句子说明实体是什么以及它现在的情况，并至少保留一条来源中已经明确的稳定事实、
      当前情况或关系；更新时读取旧内容后完整重写该句，情况变了就写新的情况，不加入来源没有提供的
      常识或推测。
  - name: details
    type: string
    role: content
    required: false
    merge: patch
    description: >-
      仅在来源确实提供了 summary 之外的信息时，使用自然的 H2 section 和 bullet 保存这个实体现在
      仍然成立的事实、当前情况、角色和关系，以及以后可能精确询问的名称、数量、日期和地点。写现在的
      情况，不写过程：情况变了就改写对应内容，不追加变化经过，不按时间罗列做过的事；仍然成立的具体
      事实照留，不泛化丢失。信息不足时必须省略，不得重复 summary、扩写常识或推测细节。
