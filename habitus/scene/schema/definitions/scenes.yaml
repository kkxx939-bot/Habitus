scene_type: scene
description: >-
  一件"事"（情景）：当天若干 occurrence 合起来为同一个目标做的事，是一段连续的时间区间。
  由每封口日一次 LLM 归组产出、代码校验落盘；天是重建单位。字段按角色分面：address 构成身份，
  semantic 供判决 LLM 与上下文投影读取，system 是溯源。边（needs / results_from）在文档信封层，
  不在字段里。全部时间为本地时间加显式偏移。
path_template: scenes/{occurred_on:%Y}/{occurred_on:%m}/{occurred_on:%d}/{label}--{started_at:%Y%m%dT%H%M%S%f%z}.md
fields:
  - {name: occurred_on, type: date, role: address, required: true, description: 情景开始的本地日历日，即目录。}
  - {name: label, type: string, role: address, required: true, description: 归组给出的目标原话（"准备晚饭"），第一期不归一；地址叶名的语义名。}
  - {name: started_at, type: datetime, role: address, required: true, description: 首成员的开始时刻，本地时间带整分钟偏移。}
  - {name: ended_at, type: datetime, role: semantic, required: true, description: 末成员的最后所见时刻；不早于开始。}
  - {name: members, type: member_list, role: semantic, required: true, description: 成员 occurrence 的行为树 URI 与角色（essential / optional / irrelevant）；至少一条、不重复；顺序按行为树时间序推、不存。}
  - {name: effects, type: string_list, role: semantic, required: true, description: 这件事做完（或做到现在）留下的改变；记录支持不了就为空数组。}
  - {name: pending_effects, type: pending_effect_list, role: semantic, required: true, description: 为将来某件事铺好的前提（按建立那一刻判，不管当天后来有没有用掉）；每项一句话加建立它的成员 URI；没有为空数组。}
  - {name: source_digest, type: sha256, role: system, required: true, description: 产生本文档那次归组的输入摘要（该日 occurrence 集合 + 参照集合）。}
  - {name: scene_version, type: string, role: system, required: true, description: 归组提示词与 schema 的版本指纹。}
